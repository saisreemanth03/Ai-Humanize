services:
  - type: web
    name: humanizeai-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8000
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
